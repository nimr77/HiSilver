<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiSilver — Desktop Preview</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #0d0d0d;
        color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
        gap: 20px;
      }

      h1 {
        font-size: 1.4rem;
        color: #ff9f43;
        letter-spacing: 0.5px;
      }
      h1 span {
        opacity: 0.5;
        font-size: 0.9rem;
      }

      #video-wrap {
        position: relative;
        width: 100%;
        max-width: 800px;
        background: #1a1a1a;
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 16/9;
        border: 2px solid #2a2a2a;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      #placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #555;
        font-size: 0.9rem;
      }

      #placeholder svg {
        width: 48px;
        height: 48px;
        opacity: 0.3;
      }

      #status-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 800px;
        background: #1a1a1a;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 0.85rem;
      }

      #dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #555;
        flex-shrink: 0;
        transition: background 0.3s;
      }
      #dot.connecting {
        background: #f7c843;
      }
      #dot.connected {
        background: #26de81;
      }
      #dot.failed {
        background: #fc5c65;
      }

      #status-text {
        flex: 1;
      }

      #controls {
        display: flex;
        gap: 12px;
      }

      button {
        padding: 8px 18px;
        border: none;
        border-radius: 6px;
        font-size: 0.85rem;
        cursor: pointer;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #btn-connect {
        background: #26de81;
        color: #000;
      }
      #btn-disconnect {
        background: #fc5c65;
        color: #fff;
      }

      #audio-indicator {
        width: 100%;
        max-width: 800px;
        background: #1a1a1a;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 0.8rem;
        color: #777;
      }

      #audio-bar-wrap {
        height: 6px;
        background: #2a2a2a;
        border-radius: 3px;
        margin-top: 6px;
        overflow: hidden;
      }
      #audio-bar {
        height: 100%;
        width: 0%;
        background: #26de81;
        border-radius: 3px;
        transition: width 0.1s;
      }
    </style>
  </head>
  <body>
    <h1>🐱 HiSilver <span>— Live Camera Preview</span></h1>

    <div id="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div id="placeholder">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"
          />
        </svg>
        <span id="placeholder-text">Press Connect to start preview</span>
      </div>
    </div>

    <div id="status-bar">
      <div id="dot"></div>
      <span id="status-text">Idle</span>
      <div id="controls">
        <button id="btn-connect">Connect</button>
        <button id="btn-disconnect" disabled>Disconnect</button>
      </div>
    </div>

    <div id="audio-indicator">
      🔊 Mobile audio level
      <div id="audio-bar-wrap"><div id="audio-bar"></div></div>
    </div>

    <script>
      const video = document.getElementById("video");
      const dot = document.getElementById("dot");
      const statusText = document.getElementById("status-text");
      const placeholder = document.getElementById("placeholder");
      const phText = document.getElementById("placeholder-text");
      const btnConnect = document.getElementById("btn-connect");
      const btnDisconn = document.getElementById("btn-disconnect");
      const audioBar = document.getElementById("audio-bar");

      let pc = null;
      let pollTimer = null;
      let audioCtx = null; // only one AudioContext ever

      function setStatus(label, state) {
        statusText.textContent = label;
        dot.className = state; // 'connecting' | 'connected' | 'failed' | ''
      }

      async function connect() {
        btnConnect.disabled = true;
        btnDisconn.disabled = false;
        setStatus("Fetching offer from desktop app…", "connecting");
        phText.textContent = "Connecting…";

        try {
          // 1. Get the SDP offer generated by the Go server
          const offerRes = await fetch("/preview/offer");
          if (!offerRes.ok)
            throw new Error(
              "GET /preview/offer → " +
                offerRes.status +
                ": " +
                (await offerRes.text()),
            );
          const { offer, sessionId } = await offerRes.json();

          // 2. Create peer connection — Go is sendonly so we only receive
          pc = new RTCPeerConnection({
            iceServers: [
              { urls: "stun:stun.l.google.com:19302" },
              { urls: "stun:stun1.l.google.com:19302" },
            ],
          });

          let streamAttached = false; // guard: attach srcObject only once
          let analyserReady = false; // guard: create AudioContext only once

          // Receive the camera + mic stream from the Go app
          pc.ontrack = (evt) => {
            // Attach the stream to the video element once (first track event)
            if (!streamAttached && evt.streams && evt.streams[0]) {
              streamAttached = true;
              video.srcObject = evt.streams[0];
              placeholder.style.display = "none";
              setStatus("Streaming ✓", "connected");
              // Explicit play() handles browsers that ignore the autoplay attribute
              video.play().catch((e) => console.warn("autoplay blocked:", e));
            }

            // Hook up audio level visualiser once for the audio track
            if (!analyserReady && evt.track.kind === "audio") {
              analyserReady = true;
              try {
                audioCtx = new AudioContext();
                const src = audioCtx.createMediaStreamSource(
                  new MediaStream([evt.track]),
                );
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                src.connect(analyser);
                const buf = new Uint8Array(analyser.frequencyBinCount);
                setInterval(() => {
                  analyser.getByteFrequencyData(buf);
                  const avg = buf.reduce((a, b) => a + b, 0) / buf.length;
                  audioBar.style.width = Math.min(100, avg * 2) + "%";
                }, 100);
                // Resume context — required in some browsers after autoplay policy
                if (audioCtx.state === "suspended") audioCtx.resume();
              } catch (e) {
                console.warn("AudioContext setup failed:", e);
              }
            }
          };

          // Trickle ICE: send browser candidates to Go server
          pc.onicecandidate = async (evt) => {
            if (evt.candidate) {
              await fetch("/preview/ice-candidate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sessionId, candidate: evt.candidate }),
              }).catch((e) => console.warn("ICE send failed:", e));
            }
          };

          pc.onconnectionstatechange = () => {
            const s = pc.connectionState;
            console.log("[WebRTC] connection state:", s);
            if (s === "connected") {
              setStatus("Streaming ✓", "connected");
              stopPoll();
            } else if (s === "failed" || s === "closed") {
              setStatus("Connection " + s, "failed");
              placeholder.style.display = "flex";
              phText.textContent = "Connection lost — press Reconnect";
              stopPoll();
              btnConnect.disabled = false;
              btnDisconn.disabled = true;
            }
          };

          pc.onicegatheringstatechange = () =>
            console.log("[WebRTC] ICE gathering:", pc.iceGatheringState);

          pc.oniceconnectionstatechange = () =>
            console.log("[WebRTC] ICE connection:", pc.iceConnectionState);

          // 3. Set the Go server's offer as remote description
          await pc.setRemoteDescription({ type: "offer", sdp: offer });

          // 4. Create answer (recvonly — browser only receives)
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          setStatus("Negotiating…", "connecting");

          // 5. Send answer to Go server
          const ansRes = await fetch("/preview/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, answer: answer.sdp }),
          });
          if (!ansRes.ok)
            throw new Error(
              "POST /preview/answer → " +
                ansRes.status +
                ": " +
                (await ansRes.text()),
            );

          // 6. Poll for ICE candidates from the Go server
          startPoll(sessionId);
        } catch (err) {
          setStatus("Error: " + err.message, "failed");
          phText.textContent = "Error — check the console";
          console.error("[Preview]", err);
          btnConnect.disabled = false;
          btnDisconn.disabled = true;
        }
      }

      function startPoll(sessionId) {
        let seen = 0;
        pollTimer = setInterval(async () => {
          if (!pc) {
            stopPoll();
            return;
          }
          try {
            const res = await fetch(
              `/preview/server-candidates?sessionId=${sessionId}&offset=${seen}`,
            );
            const data = await res.json();
            for (const c of data.candidates || []) {
              await pc.addIceCandidate(c);
              seen++;
            }
          } catch (e) {
            console.warn("poll error:", e);
          }
        }, 400);
      }

      function stopPoll() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      function disconnect() {
        stopPoll();
        if (pc) {
          pc.close();
          pc = null;
        }
        if (audioCtx) {
          audioCtx.close();
          audioCtx = null;
        }
        video.srcObject = null;
        placeholder.style.display = "flex";
        phText.textContent = "Press Connect to start preview";
        audioBar.style.width = "0%";
        setStatus("Idle", "");
        btnConnect.disabled = false;
        btnDisconn.disabled = true;
      }

      btnConnect.addEventListener("click", connect);
      btnDisconn.addEventListener("click", disconnect);
    </script>
  </body>
</html>
